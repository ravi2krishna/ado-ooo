# Mean Comment - This Line Will Be Ignored 

# YAML Files can have .yaml or .yml as extensions 

# Simple Key Value Pairs 
key: value 
name: ravi 
course: devops 

# Lists: Multiple Items 
courses:
- devops 
- python
- ai 

# Dictionaries: Set Of Key Value Pairs 
trainer:
  name: ravi 
  course: devops 
  location: hyderabad   

# In k8s we would have complex structures like this 
email: ravi2krishna 
trainer_profile:
  name: ravi 
  courses:
  - devops
  - cloud 
  - ai 

# Real World k8s file - pod.yaml 
apiVersion: v1 # key value pair 
kind: Pod # key value pair 
metadata: # Dictionary: Set of set values 
  name: nginx
spec: # Dictionary 
  containers: # List 
  - name: nginx
    image: nginx:1.14.2
    ports:
    - containerPort: 80
